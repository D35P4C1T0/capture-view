<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">FPS stability benchmark: capture-view versus mpv</title>
  <desc id="desc">Line graph comparing capture-view and mpv FPS samples on /dev/video2 MJPEG 1920x1080 at 60 FPS. capture-view is blue and mpv is red.</desc>
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="72" y="24" font-family="sans-serif" font-size="18" font-weight="700" fill="#111827">FPS stability, /dev/video2 MJPEG 1920x1080@60</text>
  <text x="72" y="343" font-family="sans-serif" font-size="12" fill="#4b5563">Blue: capture-view 60s run. Red: mpv status samples from exact playback command. Lower is worse; target is 60 FPS.</text>

  <line x1="72" y1="34" x2="72" y2="306" stroke="#111827" stroke-width="1"/>
  <line x1="72" y1="306" x2="872" y2="306" stroke="#111827" stroke-width="1"/>

  <g font-family="sans-serif" font-size="12" fill="#374151">
    <text x="36" y="310">55.5</text>
    <text x="36" y="255">56.5</text>
    <text x="36" y="201">57.5</text>
    <text x="36" y="146">58.5</text>
    <text x="36" y="92">59.5</text>
    <text x="36" y="38">60.5</text>
    <text x="430" y="330">normalized sample timeline</text>
    <text x="10" y="172" transform="rotate(-90 10 172)">FPS</text>
  </g>

  <g stroke="#d1d5db" stroke-width="1">
    <line x1="72" y1="306" x2="872" y2="306"/>
    <line x1="72" y1="251.6" x2="872" y2="251.6"/>
    <line x1="72" y1="197.2" x2="872" y2="197.2"/>
    <line x1="72" y1="142.8" x2="872" y2="142.8"/>
    <line x1="72" y1="88.4" x2="872" y2="88.4"/>
    <line x1="72" y1="34" x2="872" y2="34"/>
  </g>

  <line x1="72" y1="61.2" x2="872" y2="61.2" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text x="810" y="55" font-family="sans-serif" font-size="12" fill="#6b7280">60 FPS target</text>

  <polyline fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
    points="99.6,61.6 127.2,64.8 154.8,63.1 182.3,68.1 209.9,61.5 237.5,68.1 265.1,59.4 292.7,65.2 320.3,61.5 347.9,60.9 375.4,61.4 403.0,61.3 430.6,61.0 458.2,63.0 485.8,60.2 513.4,76.8 541.0,58.1 568.6,61.6 596.1,62.3 623.7,61.7 651.3,271.5 678.9,61.0 706.5,61.0 734.1,60.1 761.7,59.0 789.2,57.4 816.8,57.4 844.4,62.3 872.0,61.9"/>
  <polyline fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
    points="108.4,61.2 144.7,61.2 181.1,61.2 217.5,61.2 253.8,61.2 290.2,61.2 326.5,61.2 362.9,61.2 399.3,61.2 435.6,61.2 472.0,61.2 508.4,61.2 544.7,61.2 581.1,61.2 617.5,61.2 653.8,61.2 690.2,61.2 726.5,61.2 762.9,61.2 799.3,61.2 835.6,61.2 872.0,61.2"/>

  <rect x="626" y="74" width="218" height="62" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <line x1="644" y1="94" x2="684" y2="94" stroke="#2563eb" stroke-width="3"/>
  <text x="694" y="98" font-family="sans-serif" font-size="13" fill="#111827">capture-view FPS samples</text>
  <line x1="644" y1="118" x2="684" y2="118" stroke="#dc2626" stroke-width="3"/>
  <text x="694" y="122" font-family="sans-serif" font-size="13" fill="#111827">mpv status FPS samples</text>
</svg>
