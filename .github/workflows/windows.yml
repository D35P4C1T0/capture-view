name: Windows

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows UI
    runs-on: windows-latest

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        run: vcpkg install sdl3:x64-windows

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build\capture-view.exe package\
          $sdlDll = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows\bin\SDL3.dll"
          if (Test-Path $sdlDll) {
            Copy-Item $sdlDll package\
          }
          New-Item -ItemType Directory -Force package\data | Out-Null
          Copy-Item data\kirsch.bdf package\data\
          Copy-Item LICENSE package\
          Copy-Item data\kirsch.OFL.txt package\

      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $artifact = "capture-view-$env:GITHUB_REF_NAME-windows-x64"
          Compress-Archive -Path package\* -DestinationPath "$artifact.zip"
          $hash = (Get-FileHash "$artifact.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $artifact.zip" | Set-Content "$artifact.zip.sha256" -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: capture-view-windows-x64
          path: package

      - name: Publish Windows release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            capture-view-${{ github.ref_name }}-windows-x64.zip
            capture-view-${{ github.ref_name }}-windows-x64.zip.sha256
